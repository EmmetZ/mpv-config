[bilibili_bangumi_ytdl]
profile-desc=blibili-bangumi-ytdl
profile-cond=path:match("bilibili.com/bangumi")~=nil
profile-restore=copy
ytdl-raw-options=cookies="D:\mpv\portable_config\bili-cookies.txt"
ytdl-format=bestvideo[height<=?2160][vcodec!=?av01]+bestaudio/best

[anime_shaders]
profile-desc=anime shaders
profile-cond=path:match("Anime")~=nil
profile-restore=copy
# Anime4K: Mode A+A (HQ)
# Windows
# glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"
